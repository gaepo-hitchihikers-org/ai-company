services:
  openclaw-gateway:
    build: .
    container_name: nexus-gateway
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      # OpenClaw 설정 — entrypoint.sh가 /config → ~/.openclaw로 복사
      - ./openclaw.json:/config/openclaw.json:ro
      # 에이전트별 워크스페이스 — .openclaw 내부에 마운트해야 세션 경로 검증 통과
      - ./workspaces:/home/node/.openclaw/workspaces
      # 에이전트 간 공유 스토리지
      - ./shared:/home/node/.openclaw/shared
      # OpenClaw 데이터 영속화
      - openclaw-data:/home/node/.openclaw
    env_file: .env
    environment:
      - BROWSER_WS_ENDPOINT=ws://browser:3000
    depends_on:
      - browser
    restart: unless-stopped
    # 리소스 제한 (미니PC용)
    deploy:
      resources:
        limits:
          memory: 2G

  browser:
    image: browserless/chrome:latest
    container_name: nexus-browser
    restart: unless-stopped
    environment:
      - MAX_CONCURRENT_SESSIONS=5
      - CONNECTION_TIMEOUT=120000
      - PREBOOT_CHROME=true
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  openclaw-data:
